<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Dashboard</title>
</head>
<body>
    <h1>Simulation Dashboard (Live Mode)</h1>
    <div id="dashboard">
        <p>Waiting for simulation data...</p>
    </div>

    <script>
        const socket = new WebSocket("ws://localhost:8083/ws");
        
        socket.onopen = () => {
            console.log("WebSocket connected");
        };

        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                console.log("Received data:", data);
                
                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (e) {
                console.error("Error processing message:", e);
            }
        };

        socket.onclose = () => {
            console.log("WebSocket disconnected, attempting reconnect...");
            setTimeout(() => {
                window.location.reload();
            }, 5000);
        };

        socket.onerror = (error) => {
            console.error("WebSocket error:", error);
        };
    </script>
</body>
</html>
