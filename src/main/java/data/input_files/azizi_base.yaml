
WORKING:
simulationConfig:
  seedDemandTime: 10
  seedDemandQuantity: 15
  seedItemDuration: 14
  seedSupplyDisruptionTime: 11
  seedSupplyDisruptionDuration: 18
  seedMigrationTime: 13
  seedMigrationQuantity: 17
  seedFundingTime: 13
  seedFundingAmount: 16
  seedReplenishmentTime: 14
  seedTransferTime: 15
  seedTransshipmentTime: 16
  inventoryControlType: PERIODIC
  inventoryControlPeriod: &period 5
  planningHorizon: 1080
  reportEvents: false
  reportKPIs: true
  fileName: C-0.10
  campBuffer: &campBuffer 0.0
  centralBuffer: &centralBuffer 0.0

items:
  - &HygieneKit
    name: HygieneKit
    isPerishable: false
    price: 5
    orderingCost: 1200
    holdingCost: 1
    deprivationRate: 0.12
    deprivationCoefficient: 1
    referralCost: 2
    leadTimeData:
      distributionType: TRIANGULAR
      distParameters: !!data.distribution.DistTriangular
        min: 1
        mode: 2
        max: 4
  - &Medicine
    name: Medicine
    isPerishable: false
    price: 12
    orderingCost: 2400
    holdingCost: 1
    deprivationRate: 0.245
    deprivationCoefficient: 1
    referralCost: 4
    leadTimeData:
      distributionType: TRIANGULAR
      distParameters: !!data.distribution.DistTriangular
        min: 1
        mode: 2
        max: 4
camps:
  - &Kilis
    name: Kilis
    leadTimeData:
      distributionType: TRIANGULAR
      distParameters: !!data.distribution.DistTriangular
        min: 1
        mode: 2
        max: 4
    demands:
      - item: *HygieneKit
        demandTimingType: SPORADIC
        demandQuantityType: SINGLE
        arrivalData:
          distributionType: EXPONENTIAL
          distParameters: !!data.distribution.DistExponential
            mean: 0
        internalRatio: 0.2
        externalRatio: 0.02
      - item: *Medicine
        demandTimingType: SPORADIC
        demandQuantityType: SINGLE
        arrivalData:
          distributionType: EXPONENTIAL
          distParameters: !!data.distribution.DistExponential
            mean: 0
        internalRatio: 0.2
        externalRatio: 0.02
    campExternalDemandSatisfactionType: FULLY
    populationType: REGULAR
    initialInternalPopulation: 0
    initialExternalPopulation: 0
agencies:
  - name: Government
    fundingArray:
      - fundingType: MONETARY_REGULAR
        arrivalData:
          distributionType: BERNOULLI
          distParameters: !!data.distribution.DistBernoulli
            mean: 1
            arrivalInterval: 1090
            initialArrival: true
        amountData:
          distributionType: EQUAL_SHARE
          distParameters: !!data.distribution.DistEqualShare
            mean: 14900000
migrations:
  - fromCamp: *Kilis
    toCamp: *Kilis
    migrationType: INTERNAL_WITHIN_SYSTEM
    arrivalData:
      distributionType: FIXED
      distParameters: !!data.distribution.DistFixed
        mean: 120000
    migrationRatio: 0.05
inventoryPolicy: !!simulation.decision.OrderUpToPolicy
  bufferRatios:
    *Kilis:
      *HygieneKit: *campBuffer
      *Medicine: *campBuffer
  centralBufferRatios:
    *HygieneKit: *centralBuffer
    *Medicine: *centralBuffer
  periodicCounts:
    *Kilis:
      *HygieneKit: *period
      *Medicine: *period
  centralPeriodicCounts:
    *HygieneKit: *period
    *Medicine: *period
initialState:
  availableFunds: 0
  initialInventory:
    *Kilis:
      *HygieneKit: 0
      *Medicine: 0
  initialCentralWarehouseInventory:
    *HygieneKit: 0
    *Medicine: 0
  earmarkedFunds:
    *Kilis: 0
  initialEarmarkedInKind:
    *Kilis:
      *HygieneKit: 0
      *Medicine: 0
  isItemAvailable:
    *HygieneKit: true
    *Medicine: true
