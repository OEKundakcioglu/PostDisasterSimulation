simulationConfig:
  seedDemandTime: 0
  seedDemandQuantity: 12
  seedItemDuration: 0
  seedSupplyDisruptionTime: 0
  seedSupplyDisruptionDuration: 0
  seedMigrationTime: 0
  seedMigrationQuantity: 21
  seedFundingTime: 0
  seedFundingAmount: 12
  seedReplenishmentTime: 0
  seedTransferTime: 0
  seedTransshipmentTime: 0
  inventoryControlType: PERIODIC
  inventoryControlPeriod: &period 10
  planningHorizon: 1080
  reportEvents: false
  reportKPIs: true
  fileName: C-0.10
  campBuffer: &campBuffer 0
  centralBuffer: &centralBuffer 0
items:
  - &hygienekit
    name: HygieneKit
    isPerishable: false
    price: 5
    orderingCost: 1202
    holdingCost: 1
    deprivationRate: 0.11
    deprivationCoefficient: 1
    referralCost: 2
    leadTimeData:
      distributionType: EXPONENTIAL
      distParameters: !!data.distribution.DistExponential
        mean: 2
  - &medicine
    name: Medicine
    isPerishable: true
    price: 12
    orderingCost: 1400
    holdingCost: 0.2
    deprivationRate: 0.245
    deprivationCoefficient: 1
    referralCost: 4.06
    durationData:
      distributionType: NORMAL
      distParameters: !!data.distribution.DistNormal
        [45, 5]
    leadTimeData:
      distributionType: TRIANGULAR
      distParameters: !!data.distribution.DistTriangular
        min: 1
        mode: 2
        max: 4
camps:
  - &hatay-1
    name: Hatay-1
    leadTimeData:
      distributionType: FIXED
      distParameters: !!data.distribution.DistFixed
        mean: 2
    demands:
      - item: *hygienekit
        demandTimingType: SPORADIC
        demandQuantityType: SINGLE
        arrivalData:
          distributionType: EXPONENTIAL
          distParameters: !!data.distribution.DistExponential
            mean: 0.033
        internalRatio: 0.4
        externalRatio: 0.05
      - item: *medicine
        demandTimingType: SPORADIC
        demandQuantityType: SINGLE
        arrivalData:
          distributionType: EXPONENTIAL
          distParameters: !!data.distribution.DistExponential
            mean: 0.0167
        internalRatio: 0.2
        externalRatio: 0.02
    campExternalDemandSatisfactionType: FULLY
    populationType: PRIORITIZED
    initialInternalPopulation: 12312
    initialExternalPopulation: 144103
  - &hatay-2
    name: Hatay-2
    leadTimeData:
      distributionType: EQUAL_SHARE
      distParameters: !!data.distribution.DistEqualShare
        mean: 2
    demands:
      - item: *hygienekit
        demandTimingType: PERIODIC
        demandQuantityType: SINGLE
        arrivalData:
          distributionType: EXPONENTIAL
          distParameters: !!data.distribution.DistExponential
            mean: 0.033
        internalRatio: 0.5
        externalRatio: 0.05
      - item: *medicine
        demandTimingType: ONETIME
        demandQuantityType: SINGLE
        arrivalData:
          distributionType: EXPONENTIAL
          distParameters: !!data.distribution.DistExponential
            mean: 0.0167
        internalRatio: 0.2
        externalRatio: 0.02
    campExternalDemandSatisfactionType: NONE
    populationType: REGULAR
    initialInternalPopulation: 214212
    initialExternalPopulation: 14410
agencies:
  - name: Government
    fundingArray:
      - fundingType: INKIND_EARMARKED
        item: *hygienekit
        arrivalData:
          distributionType: BERNOULLI
          distParameters: !!data.distribution.DistBernoulli
            mean: 1
            arrivalInterval: 1090
            initialArrival: true
        amountData:
          distributionType: FIXED
          distParameters: !!data.distribution.DistFixed
            mean: 1
      - fundingType: MONETARY_REGULAR
        arrivalData:
          distributionType: BERNOULLI
          distParameters: !!data.distribution.DistBernoulli
            mean: 1
            arrivalInterval: 1090
            initialArrival: true
        amountData:
          distributionType: EQUAL_SHARE
          distParameters: !!data.distribution.DistEqualShare
            mean: 14900000
  - name: we
    fundingArray:
      - fundingType: INKIND_EARMARKED
        item: *hygienekit
        arrivalData:
          distributionType: BERNOULLI
          distParameters: !!data.distribution.DistBernoulli
            mean: 1
            arrivalInterval: 1090
            initialArrival: true
        amountData:
          distributionType: EQUAL_SHARE
          distParameters: !!data.distribution.DistEqualShare
            mean: 14900000
migrations:
  - migrationType: EXTERNAL_TO_SYSTEM
    toCamp: *hatay-2
    arrivalData:
      distributionType: UNIFORM
      distParameters: !!data.distribution.DistUniform
        min: 1
        max: 10
    quantityData:
      distributionType: FIXED
      distParameters: !!data.distribution.DistFixed
        mean: 500
    migrationRatio: 0.05
  - migrationType: EXTERNAL_FROM_SYSTEM
    fromCamp: *hatay-1
    arrivalData:
      distributionType: BERNOULLI
      distParameters: !!data.distribution.DistBernoulli
        mean: 0.5
    migrationRatio: 0.05
  - migrationType: EXTERNAL_TO_SYSTEM
    toCamp: *hatay-2
    arrivalData:
      distributionType: UNIFORM
      distParameters: !!data.distribution.DistUniform
        min: 1
        max: 10
    quantityData:
      distributionType: NORMAL
      distParameters: !!data.distribution.DistNormal
        [500, 100]
    migrationRatio: 0.05
inventoryPolicy: !!simulation.decision.OrderUpToPolicy
  bufferRatios:
    *hatay-1:
      *hygienekit: *campBuffer
      *medicine: *campBuffer
    *hatay-2:
      *hygienekit: *campBuffer
      *medicine: *campBuffer
  centralBufferRatios:
    *hygienekit: *centralBuffer
    *medicine: *centralBuffer
  periodicCounts:
    *hatay-1:
      *hygienekit: 10
      *medicine: 10
    *hatay-2:
      *hygienekit: 10
      *medicine: 10
  centralPeriodicCounts:
    *hygienekit: 10
    *medicine: 10
initialState:
  availableFunds: 0
  initialInventory:
    *hatay-1:
      *hygienekit: 0
      *medicine: 0
    *hatay-2:
      *hygienekit: 0
      *medicine: 0
  initialCentralWarehouseInventory:
    *hygienekit: 0
    *medicine: 0
  earmarkedFunds:
    *hatay-1: 14
    *hatay-2: 0
  initialEarmarkedInKind:
    *hatay-1:
      *hygienekit: 0
      *medicine: 0
    *hatay-2:
      *hygienekit: 0
      *medicine: 0
  isItemAvailable:
    *hygienekit: true
    *medicine: true
