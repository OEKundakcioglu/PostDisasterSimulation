simulationConfig:
  seedDemandTime: 0
  seedDemandQuantity: 0
  seedItemDuration: 0
  seedSupplyDisruptionTime: 0
  seedSupplyDisruptionDuration: 0
  seedMigrationTime: 0
  seedMigrationQuantity: 0
  seedFundingTime: 0
  seedFundingAmount: 0
  seedReplenishmentTime: 0
  seedTransferTime: 0
  seedTransshipmentTime: 0
  inventoryControlType: PERIODIC
  inventoryControlPeriod: &period 5
  planningHorizon: 1080
  reportEvents: false
  reportKPIs: true
  fileName: C-0.10
  campBuffer: &campBuffer 0
  centralBuffer: &centralBuffer 0
items:
  - &hygienekit
    name: HygieneKit
    isPerishable: false
    price: 5
    orderingCost: 1200
    holdingCost: 1
    deprivationRate: 0.12
    deprivationCoefficient: 1
    referralCost: 2
    leadTimeData:
      distributionType: TRIANGULAR
      distParameters: !!data.distribution.DistTriangular
        min: 1
        mode: 2
        max: 4
  - &medicine
    name: Medicine
    isPerishable: true
    price: 12
    orderingCost: 2400
    holdingCost: 1
    deprivationRate: 0.245
    deprivationCoefficient: 1
    referralCost: 4
    durationData:
      distributionType: UNIFORM
      distParameters: !!data.distribution.DistUniform
        min: 30
        max: 60
    leadTimeData:
      distributionType: TRIANGULAR
      distParameters: !!data.distribution.DistTriangular
        min: 1
        mode: 2
        max: 4
camps:
  - &hatay-1
    name: Hatay-1
    leadTimeData:
      distributionType: TRIANGULAR
      distParameters: !!data.distribution.DistTriangular
        min: 1
        mode: 2
        max: 4
    demands:
      - item: *hygienekit
        demandTimingType: SPORADIC
        demandQuantityType: SINGLE
        arrivalData:
          distributionType: EXPONENTIAL
          distParameters: !!data.distribution.DistExponential
            mean: 0.033
        internalRatio: 0.5
        externalRatio: 0.05
      - item: *medicine
        demandTimingType: SPORADIC
        demandQuantityType: SINGLE
        arrivalData:
          distributionType: EXPONENTIAL
          distParameters: !!data.distribution.DistExponential
            mean: 0.0167
        internalRatio: 0.2
        externalRatio: 0.02
    campExternalDemandSatisfactionType: FULLY
    populationType: REGULAR
    initialInternalPopulation: 2142
    initialExternalPopulation: 144105
  - &hatay-2
    name: Hatay-2
    leadTimeData:
      distributionType: TRIANGULAR
      distParameters: !!data.distribution.DistTriangular
        min: 1
        mode: 2
        max: 4
    demands:
      - item: *hygienekit
        demandTimingType: SPORADIC
        demandQuantityType: SINGLE
        arrivalData:
          distributionType: EXPONENTIAL
          distParameters: !!data.distribution.DistExponential
            mean: 0.033
        internalRatio: 0.5
        externalRatio: 0.05
      - item: *medicine
        demandTimingType: SPORADIC
        demandQuantityType: SINGLE
        arrivalData:
          distributionType: EXPONENTIAL
          distParameters: !!data.distribution.DistExponential
            mean: 0.0167
        internalRatio: 0.2
        externalRatio: 0.02
    campExternalDemandSatisfactionType: FULLY
    populationType: REGULAR
    initialInternalPopulation: 2142
    initialExternalPopulation: 144105
agencies:
  - name: Government
    fundingArray:
      - fundingType: MONETARY_REGULAR
        arrivalData:
          distributionType: BERNOULLI
          distParameters: !!data.distribution.DistBernoulli
            mean: 1
            arrivalInterval: 1090
            initialArrival: true
        amountData:
          distributionType: EQUAL_SHARE
          distParameters: !!data.distribution.DistEqualShare
            mean: 14900000
migrations:
  - migrationType: INTERNAL_WITHIN_SYSTEM
    fromCamp: *hatay-1
    toCamp: *hatay-2
    arrivalData:
      distributionType: FIXED
      distParameters: !!data.distribution.DistFixed
        mean: 120000
    migrationRatio: 0.05
inventoryPolicy: !!simulation.decision.OrderUpToPolicy
  bufferRatios:
    *hatay-1:
      *hygienekit: *campBuffer
      *medicine: *campBuffer
    *hatay-2:
      *hygienekit: *campBuffer
      *medicine: *campBuffer
  centralBufferRatios:
    *hygienekit: *centralBuffer
    *medicine: *centralBuffer
  periodicCounts:
    *hatay-1:
      *hygienekit: *period
      *medicine: *period
    *hatay-2:
      *hygienekit: *period
      *medicine: *period
  centralPeriodicCounts:
    *hygienekit: *period
    *medicine: *period
initialState:
  availableFunds: 0
  initialInventory:
    *hatay-1:
      *hygienekit: 0
      *medicine: 0
    *hatay-2:
      *hygienekit: 0
      *medicine: 0
  initialCentralWarehouseInventory:
    *hygienekit: 0
    *medicine: 0
  earmarkedFunds:
    *hatay-1: 0
    *hatay-2: 0
  initialEarmarkedInKind:
    *hatay-1:
      *hygienekit: 0
      *medicine: 0
    *hatay-2:
      *hygienekit: 0
      *medicine: 0
  isItemAvailable:
    *hygienekit: true
    *medicine: true
